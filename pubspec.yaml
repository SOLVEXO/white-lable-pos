name: solvexo_pos
description: "Solvexo POS — standalone point-of-sale app for sellers."
publish_to: 'none'

version: 1.0.0+100

environment:
  sdk: ^3.9.2

# A fully independent app: no dependency on book_store_app. Every repository,
# model, component, theme file, and asset it needs lives inside this package
# (copied from the main app, then trimmed to what POS actually uses).
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  intl: ^0.20.2
  mobile_scanner: ^7.2.0
  share_plus: ^12.0.2
  shimmer: ^3.0.0
  flutter_svg: ^2.2.3
  image_picker: ^1.2.1
  responsive_sizer: ^3.3.1
  shared_preferences: ^2.5.4
  google_sign_in: ^7.2.0
  firebase_core: ^3.6.0
  permission_handler: ^12.0.1
  cached_network_image: ^3.4.1
  http_parser: ^4.1.2
  audioplayers: ^6.6.0
  # Receipt PDF generation (Phase 1) — no printer hardware integration exists
  # yet, so receipts are scoped to in-app + shareable PDF, per the Phase 1
  # plan. Shared via the already-used share_plus, no `printing` package needed.
  pdf: ^3.11.1
  # Network-interface status for the offline banner (Phase 3) — reflects
  # whether a network interface is connected, not verified internet
  # reachability; see NetworkStatusService's doc comment.
  connectivity_plus: ^6.1.5
  # Local queue for sales made while offline (Phase 3) — both were already
  # previously transitive dependencies; direct since
  # PendingSaleLocalStore now uses them explicitly.
  sqflite: ^2.4.2
  path: ^1.9.1
  # Auth token storage (Phase 4 security pass) — Keychain/Keystore-backed,
  # replacing plaintext shared_preferences for the access/refresh tokens.
  flutter_secure_storage: ^9.2.4
  # Thermal receipt printer support (Phase 3) — print_bluetooth_thermal is
  # the Bluetooth transport (list/connect/write bytes; no location
  # permission needed, unlike older classic-Bluetooth packages);
  # esc_pos_utils_plus builds the actual ESC/POS command bytes. Chosen over
  # esc_pos_bluetooth, which is stale (pinned to Dart 2.12, depends on an
  # unmaintained Bluetooth plugin).
  # Pinned below latest (1.2.4) — that requires Flutter >=3.44.0, newer than
  # this project's installed SDK (3.35.6). 1.2.1 is the newest version still
  # compatible.
  print_bluetooth_thermal: 1.2.1
  esc_pos_utils_plus: ^2.0.4

  # Pinned to the exact version the main app's pubspec.lock resolves to —
  # newer dio releases have added DioExceptionType cases not handled by
  # dio_exception_handler.dart's switch, which fails the compiler's
  # exhaustiveness check even though flutter analyze doesn't catch it.
  dio: 5.9.0

  # Hosted Stripe Checkout / Billing Portal for per-store POS subscriptions —
  # opened in-app rather than a native payment sheet, same pattern as the
  # buyer app's gateway_payment flow. Version matches solvexo-app's pubspec.
  cryptography: ^2.9.0
  firebase_crashlytics: ^4.3.10
  sign_in_with_apple: ^7.0.1
  cryptography_flutter: ^2.3.4
  crypto: ^3.0.8
  qr_flutter: ^4.1.0
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  sqflite_common_ffi: ^2.3.7+1

# Icons + native splash are generated from ONE source: assets/icon/app_icon.png (1024x1024, opaque, full-bleed).
# To rebrand: replace assets/icon/app_icon.png (and app_icon_foreground.png for the Android adaptive icon), then run
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true       # App Store icons must have no transparency
  min_sdk_android: 24
  adaptive_icon_background: "#F06839"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  # Always dark ink (#0B1020) with the logo tile: identical to the Flutter splash's first frame
  # (lib/app/modules/splash_screen), so there is no flash and no colour jump on hand-off.
  # splash_logo.png is a 480px tile (treated as @4x => 120 logical px); the Android 12 variant
  # is a 960px canvas with the tile drawn at 400px (=> 120dp inside the 288dp icon area).
  color: "#0B1020"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0B1020"
    image: assets/icon/splash_logo_android12.png
    icon_background_color: "#0B1020"
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
    - assets/app_fonts/
    - assets/app_fonts/manrope/OFL.txt
    - assets/app_fonts/dm_sans/OFL.txt
    - assets/app_fonts/roboto/LICENSE-Apache-2.0.txt
    - assets/sounds/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/app_fonts/inter/Inter_Regular.ttf
          weight: 400
        - asset: assets/app_fonts/inter/Inter_Medium.ttf
          weight: 500
        - asset: assets/app_fonts/inter/Inter_SemiBold.ttf
          weight: 600
        - asset: assets/app_fonts/inter/Inter_Bold.ttf
          weight: 700
    # Solvexo POS blueprint typography: Manrope (display) + DM Sans (body). Both are VARIABLE fonts (one file each, SIL OFL 1.1,
    # licences beside the files). The same file is declared once per weight so Flutter never fakes a bold; the matching `wght`
    # axis value is set by AppTypeScale (FontWeight alone does not move a variable axis). Manrope has OpenType `tnum` and is used for
    # every amount (tabular figures); DM Sans has no `tnum`, so it is body text only.
    - family: Manrope
      fonts:
        - asset: assets/app_fonts/manrope/Manrope-Variable.ttf
          weight: 400
        - asset: assets/app_fonts/manrope/Manrope-Variable.ttf
          weight: 500
        - asset: assets/app_fonts/manrope/Manrope-Variable.ttf
          weight: 600
        - asset: assets/app_fonts/manrope/Manrope-Variable.ttf
          weight: 700
        - asset: assets/app_fonts/manrope/Manrope-Variable.ttf
          weight: 800
    - family: DMSans
      fonts:
        - asset: assets/app_fonts/dm_sans/DMSans-Variable.ttf
          weight: 400
        - asset: assets/app_fonts/dm_sans/DMSans-Variable.ttf
          weight: 500
        - asset: assets/app_fonts/dm_sans/DMSans-Variable.ttf
          weight: 600
        - asset: assets/app_fonts/dm_sans/DMSans-Variable.ttf
          weight: 700
    # Roboto Medium only for the official "Sign in with Google" button label (Google's branding
    # guideline mandates Roboto Medium). Apache-2.0, bundled with Flutter's own material fonts.
    - family: Roboto
      fonts:
        - asset: assets/app_fonts/roboto/Roboto-Medium.ttf
          weight: 500
